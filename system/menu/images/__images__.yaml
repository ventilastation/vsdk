palettegroups:
  palette1:
    # One strip per games/<group>/<name>/menu.png, expanded by
    # tools/generate_roms.py; per-game frame counts come from each game's
    # meta.json ("menu_frames"). Adding a game needs no edit here.
    - game_menu_strips: true
    - strip: menu.png
      frames: 16
    - strip: voom.png
    - strip: nes.png
    - strip: sms.png
    - strip: gameboy.png
    - strip: msx.png
    - strip: pollitos.png
      frames: 5
    - strip: vslogo.png
    - strip: loviejo-3.png
    - fullscreen: favalli.png
  palette2:
    # Glyphs for the current-selection text label (system/launcher).  Kept
    # in its own palette group so the label doesn't dilute palette1's
    # 255-colour budget; same source as system/shared/other/images'.
    - strip: ../../shared/other/images/tinyfont_menu.png
      frames: 255

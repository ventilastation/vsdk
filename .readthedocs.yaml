# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/vs2/conf.py
  # Warnings are broken references or orphaned pages; both are invisible to
  # the reader, so fail the build rather than publish them.
  fail_on_warning: true

python:
  install:
    - requirements: docs/vs2/requirements.txt

formats:
  - pdf

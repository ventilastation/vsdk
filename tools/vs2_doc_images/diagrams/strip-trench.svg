<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="system-ui,sans-serif">
  <rect width="760" height="290" fill="#0b0f14"/>
  <text x="40" y="44" fill="#e6edf3" font-size="24" font-weight="600">terrain.png: a tileset is a strip too</text>
  <!-- 96x16 px image scaled x6 -->
  <image x="92" y="76" width="576" height="96" href="{{art:alecu/mapdemo/images/terrain.png}}" style="image-rendering:pixelated"/>
  <g stroke="#f5b800" stroke-width="2" stroke-dasharray="6 5">
    <line x1="92" y1="68" x2="92" y2="180"/><line x1="188" y1="68" x2="188" y2="180"/>
    <line x1="284" y1="68" x2="284" y2="180"/><line x1="380" y1="68" x2="380" y2="180"/>
    <line x1="476" y1="68" x2="476" y2="180"/><line x1="572" y1="68" x2="572" y2="180"/>
    <line x1="668" y1="68" x2="668" y2="180"/>
  </g>
  <g fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">
    <text x="140" y="206">0</text><text x="236" y="206">1</text><text x="332" y="206">2</text>
    <text x="428" y="206">3</text><text x="524" y="206">4</text><text x="620" y="206">5</text>
  </g>
  <g fill="#aebccb" font-size="17" text-anchor="middle">
    <text x="140" y="230">GRASS</text><text x="236" y="230">WATER</text><text x="332" y="230">ROCK</text>
    <text x="428" y="230">SAND</text><text x="524" y="230">MARKER</text><text x="620" y="230">WALL</text>
  </g>
  <text x="380" y="268" fill="#8aa0b5" font-size="17" text-anchor="middle">each cell in the tilemap holds one of these numbers (255 = empty)</text>
</svg>
